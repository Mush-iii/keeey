[package]
name = "pulsetype"
version = "1.0.0"
description = "PulseType - a local-first touch typing trainer"
authors = ["PulseType contributors"]
license = "GPL-3"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pulsetype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
